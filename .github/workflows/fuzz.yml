name: Fuzz

# Daily fuzz run for the cargo-fuzz harnesses under fuzz/. Splits the
# 30-minute total budget across the 6 targets (~5 min each). The
# `flac_oracle_decode` target dlopens libavcodec via libloading; the CI
# runner needs `ffmpeg` (which pulls libavcodec61 on current Ubuntu)
# installed so the oracle actually validates instead of silently
# skipping. We also install `flac libflac-dev` so the system carries
# the reference encoder/decoder alongside it (handy for future
# fixture-driven harnesses, and matches the layout other oxideav
# audio crates use).

on:
  schedule:
    - cron: "37 6 * * *"   # daily 06:37 UTC, jittered off the hour
  workflow_dispatch:

jobs:
  fuzz:
    uses: OxideAV/.github/.github/workflows/crate-fuzz.yml@master
    with:
      extra_packages_apt: "ffmpeg flac libflac-dev"
      time_budget_seconds: 1800
    secrets: inherit
