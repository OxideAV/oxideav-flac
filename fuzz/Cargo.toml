[package]
name = "oxideav-flac-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
oxideav-core = "0.1"
# libloading is the only libavcodec interop: the cross-decode oracle
# `dlopen`s the system-installed shared library at startup. No
# `ffmpeg-sys` / `rusty_ffmpeg`-style build-script dep that would pull
# libavcodec source into the workspace's cargo dep tree. The harness
# skips silently (eprintln, no `#[ignore]`) when libavcodec isn't
# installed (see fuzz/src/lib.rs).
#
# Why libavcodec instead of libFLAC: libFLAC's `<FLAC/stream_decoder.h>`
# API is callback-driven (read / seek / eof / write / error / metadata
# callbacks) — wrapping that cleanly through `libloading` requires
# trampolines that hold per-call state, which is awkward and fragile.
# libavcodec exposes the simpler `avcodec_send_packet` /
# `avcodec_receive_frame` buffer-in/buffer-out API for `AV_CODEC_ID_FLAC`
# (== 86028) and is installed on every CI runner that already has
# `ffmpeg`. Workspace policy bars vendoring libavcodec / libFLAC source
# — we only inspect the public C headers (<libavcodec/avcodec.h>,
# <libavutil/frame.h>, <libavutil/samplefmt.h>) for function signatures
# + opaque pointer typedefs.
libloading = "0.8"

[dependencies.oxideav-flac]
path = ".."

[lib]
name = "oxideav_flac_fuzz"
path = "src/lib.rs"

# Prevent this fuzz package from being pulled into the umbrella
# workspace at `crates/*` glob-resolve time.
[workspace]
members = ["."]

[profile.release]
debug = 1

# ------------------------------------------------------------------
# Fuzz targets.
# ------------------------------------------------------------------

# Target 1: panic-freedom. Feed arbitrary bytes through the FLAC
# demuxer + decoder pipeline. Every public API surface MUST return a
# `Result` for malformed input — never panic, never abort.
[[bin]]
name = "panic_free_decode"
path = "fuzz_targets/panic_free_decode.rs"
test = false
doc = false

# Target 2: oxideav-flac self-roundtrip. Encode random PCM frames,
# decode, expect bit-exact recovery (FLAC is lossless).
[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false

# Target 3: libavcodec oracle. Use OUR encoder to synthesise a valid
# FLAC stream from arbitrary PCM input; decode through both
# oxideav-flac and libavcodec; assert bit-exact per-sample equality
# whenever libavcodec accepts (FLAC is lossless — no tolerance).
[[bin]]
name = "flac_oracle_decode"
path = "fuzz_targets/flac_oracle_decode.rs"
test = false
doc = false

# Target 4: panic-free decode entry, sibling-shape (ico/qoi/bmp/tta).
# A single libfuzzer entry that funnels arbitrary bytes through every
# pure-`Result` public parser (`BlockHeader::parse`,
# `StreamInfo::parse`, `parse_seektable`, `parse_cuesheet`,
# `parse_frame_header`) AND the full demux+decode pipeline. Overlaps
# with `panic_free_decode` on the pipeline path but covers the
# direct-API parsers it didn't reach. Cheap per iteration so the
# scheduler can keep it warm alongside the heavier targets.
[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false

# Target 5: METADATA_BLOCK chain walker + writer round-trip. Walks
# a `fLaC`-magic-led chain of `BlockHeader::parse` → typed parser
# (StreamInfo / SeekTable / CueSheet / Picture / PADDING-length) →
# matching writer → re-parse, asserting parser ∘ writer ∘ parser
# == parser at every step. Covers `parse_picture` + `write_picture`
# + `write_cuesheet` + `write_seektable` + `write_padding` +
# `BlockHeader::write_into`, none of which any existing target
# exercises in writer-direction. Bounded loop (≤ 16 blocks per
# iteration, ≤ 64 KiB per payload) so the fuzzer can't pin a
# worker on a pathological chain.
[[bin]]
name = "metadata_walker"
path = "fuzz_targets/metadata_walker.rs"
test = false
doc = false

# Target 6 (round 228): `make_encoder_with_options` construction +
# post-flush extradata-chain verification. Sweeps a fuzzer-chosen
# `FlacEncoderOptions { padding_bytes }` (None / Some(0) / Some(small)
# / Some(near-cap) / Some(over-cap)) alongside fuzzer-chosen channels
# (raw u8 — most values land outside the `1..=8` guard), sample rate
# (incl. pathological 0 / 1 / u32::MAX edges), and sample format. On
# every successful construction the harness walks STREAMINFO ±
# PADDING via `BlockHeader::parse`, asserting the chain invariants
# (STREAMINFO `last` flag, PADDING `last=true` + requested length +
# all-zero payload per RFC 9639 §8.6, no trailing slack). When the
# parameters round-trip cleanly, a small PCM tail is pushed through
# `send_frame` -> `flush` -> `receive_packet*` and the chain
# invariants are re-asserted on the post-flush extradata so the
# STREAMINFO repopulation can't corrupt the PADDING tail.
[[bin]]
name = "encoder_options"
path = "fuzz_targets/encoder_options.rs"
test = false
doc = false

# Target 7 (round 232): `oxideav_flac::md5` streaming-vs-oneshot
# equivalence. The encoder feeds the running MD5 a single
# deterministic schedule (one `update` per audio frame); no existing
# target stresses the chunk-schedule surface of `Md5::update` /
# `Md5::finalize`. A divergence between the streaming API and the
# oneshot `md5::compute()` helper would silently produce a
# STREAMINFO whose 128-bit MD5 signature (RFC 9639 §8.2) does not
# match the decoded PCM bytes a verifier would recompute over the
# stream — every emitted `.flac` would carry an md5sum mismatch
# under round-trip verification. The harness sweeps seven distinct
# chunk schedules per fuzz iteration (even split, xorshift-irregular,
# byte-at-a-time, zero-length interludes, `Md5::default()` parity,
# 64-byte block-aligned, prime-stride-7) against a payload tail
# capped at 8 KiB and asserts byte-for-byte equality of every
# schedule's digest against the oneshot reference. Re-asserts the
# RFC 1321 §A.5 empty-input vector on every iteration so a
# finalize-pad regression can't slip past a fuzzer that never
# produces a zero-length payload.
[[bin]]
name = "md5_streaming"
path = "fuzz_targets/md5_streaming.rs"
test = false
doc = false

# Target 8 (round 237): focused stress on the FLAC UTF-8-shaped
# variable-length integer (`bits_ext::{read_utf8_u64,
# write_utf8_u64}`, RFC 9639 §9.1.5). Every host-pipeline target
# exercises one value per emitted frame; this target sweeps the
# value space across all seven lead-byte-range boundaries
# (0xxxxxxx / 110xxxxx / 1110xxxx / 11110xxx / 111110xx / 1111110x
# / 11111110), asserts writer→reader round-trip equivalence, the
# documented per-bit-width byte-length stability, and reader
# robustness against arbitrary input bytes (including continuation
# bytes 0x80..=0xBF and the reserved 0xFF sentinel that the writer
# never produces).
[[bin]]
name = "utf8_varint"
path = "fuzz_targets/utf8_varint.rs"
test = false
doc = false

# Target 9 (round 259): focused stress on
# `oxideav_flac::frame::parse_frame_header` — the RFC 9639 §9.1
# frame sync header. The host-pipeline targets only see whatever
# (block_size_code, sample_rate_code, channel_code, sample_size_code)
# tuple the encoder happened to emit (the encoder picks code values
# from a narrow steady-state subset of the 16×16×16×8 reachable
# combinations); `utf8_varint` only exercises the coded-number
# field in isolation outside any header framing or CRC verification.
# This harness builds a syntactically valid header from
# fuzzer-controlled (blocking + 4 code values + immediates +
# coded_number) and asserts the parser recovers the exact tuple
# the constructor emitted (block_size, sample_rate, channels, bps,
# coded_number, blocking_strategy, header_byte_len). Every iteration
# unconditionally sweeps all (block-size-code × sample-rate-code ×
# channel-code × sample-size-code) combinations at seven
# coded-number boundaries (~24 K well-formed headers per iter) so
# a regression on any code-table entry is reached even before the
# fuzzer's corpus has converged. Reserved-code rejection is
# asserted for every spec-marked-reserved value (block_size_code 0,
# sample_rate_code 15, sample_size_code 3 + 7, channel_code 11..=15).
# A 14-position single-bit-flip sweep on the constructed header
# asserts CRC verification stability under arbitrary corruption.
# Finally, the raw fuzz input is fed to `parse_frame_header` at
# four sliding offsets for panic-freedom on hand-crafted bytes.
[[bin]]
name = "frame_header"
path = "fuzz_targets/frame_header.rs"
test = false
doc = false

# Target 10 (round 283): whole-chain `MetadataChain` parse / write
# round-trip with a structure-preserving mutation oracle. The typed
# chain API (r279) owns RFC 9639 §8's *stream-level* MUSTs —
# STREAMINFO first, singleton STREAMINFO / SEEKTABLE /
# VORBIS_COMMENT, at most one each of picture types 1 and 2
# (Table 13), forbidden block-type 127, `last`-flag placement —
# none of which `metadata_walker` (which predates the API) can see.
# Three phases per iteration: (1) raw bytes into
# `MetadataChain::parse` with the full parse-Ok ⇒ validate-Ok ⇒
# write-Ok ⇒ equal-re-parse ⇒ byte-stable-re-write contract;
# (2) a typed-chain synthesizer whose field values are always
# writer-acceptable but whose chain *shape* is fuzzer-controlled,
# checked against an independent re-statement of the §8 rules —
# valid shapes must round-trip, invalid shapes must be refused by
# BOTH the writer and the parser (via hand-assembled wire bytes);
# (3) structure-preserving mutations of the valid wire image —
# `last`-flag truncation (typed-prefix oracle), forbidden-127
# header rewrite, PADDING-content corruption (§8.3 scrub-to-zero
# oracle), and arbitrary single-byte XOR. Shipped alongside two
# fixes it motivated: `parse_cuesheet` now enforces the §8.7
# printable-ASCII media-catalog rule its own writer applies, and
# `MetadataChain::parse` now rejects SEEKTABLE points violating
# the §8.5.1 sorted/unique MUSTs `write_seektable` enforces.
[[bin]]
name = "metadata_chain"
path = "fuzz_targets/metadata_chain.rs"
test = false
doc = false

# Target 11 (round 292): structure-aware stress on
# `oxideav_flac::subframe::decode_subframe` — the RFC 9639 §9.2 subframe
# decoder (CONSTANT / VERBATIM / FIXED 0..=4 / LPC 1..=32 + the §9.2.7
# residual Rice-partition coder incl. the escape partition). Every prior
# target reaches the subframe path only obliquely: the demuxer-fed targets
# (`panic_free_decode`, `decode`) gate it behind a valid `fLaC` magic +
# STREAMINFO + CRC-8 header that random input almost never threads, and the
# encode-side targets (`roundtrip`, `flac_oracle_decode`) only ever feed it
# the narrow subframe shapes our own encoder emits (no residual escape, no
# LPC order > 8, no adversarial truncation). This harness calls
# `decode_subframe` directly with fuzzer-chosen `(block_size, bps)` pulled
# from the genuinely production-reachable envelope — `block_size` ∈
# 1..=65535 (the §9.1 16-bit immediate cap; larger would probe an
# unreachable allocation and report a phantom OOM), `bps` ∈ 0..=35 covering
# the rejected 0 / >32 guard (incl. the 33-bit side-channel depth that was
# the 2026-05-10 panic) and the valid 1..=32 range — over an
# attacker-controlled bitstream. Drives the unary wasted-bit drain, the
# signed `qlp_shift` range check (shift-by-≥64 UB candidate), the
# `partition_size <= predictor_order` / `block_size % n_partitions`
# residual-partition maths across every predictor order, and the escape
# partition's raw-bps path. Contract: pure panic-freedom — every
# `(block_size, bps, bitstream)` combination returns a `Result`. A fixed
# `(block_size × bps)` sweep at two offsets primes the bps guard + every
# FIXED/LPC order on the first input.
[[bin]]
name = "subframe_decode"
path = "fuzz_targets/subframe_decode.rs"
test = false
doc = false

# Target 12 (round 299): focused stress on the FLAC APPLICATION metadata
# block — `oxideav_flac::metadata::{parse_application, write_application,
# Application}` (RFC 9639 §8.4). The typed APPLICATION pair (added r244)
# is the only typed metadata-block surface with no direct fuzz coverage:
# `metadata_walker`'s `try_typed_round_trip` explicitly no-ops on
# `BlockType::Application`, and `metadata_chain` only reaches the parser
# behind a structurally valid full-chain gate. This harness drives both
# directions directly — raw-byte parse for panic-freedom (only a < 4-byte
# payload may reject; §8.4 admits a zero-length data run), the positional
# byte-stability round-trip (`write(parse(x)) == x` for any accepted `x`),
# and a synthesised-struct writer drive (fuzzer-chosen id + bounded data
# run) so the writer sees shapes the parser never produces. The 24-bit
# `BlockHeader::MAX_LENGTH` ceiling-reject branch is left to
# `metadata::tests` (reproducing it here would force a ~16 MiB allocation
# per iteration). Contract: pure panic-freedom + parse/write contract
# agreement on every input.
[[bin]]
name = "application"
path = "fuzz_targets/application.rs"
test = false
doc = false

# Target 13 (round 318): panic-freedom of the demuxer seek path —
# `<FlacDemuxer as Demuxer>::seek_to` + post-seek packet drain. No
# existing target ever calls `seek_to`: the host-pipeline targets
# (`panic_free_decode`, `decode`) only walk `next_packet` linearly, and
# `benches/seek.rs` exercises seeking but only over a valid
# encoder-produced stream whose SEEKTABLE was built by `write_seektable`
# (which enforces the §8.5.1 sorted/unique/in-range MUSTs). This harness
# reaches the seek arithmetic with adversarial input two ways: (Path A)
# raw fuzz bytes into the demuxer + a seek-target sweep (covers the
# magic-reject / no-SEEKTABLE / stream-index-out-of-range error arms
# cheaply); (Path B) a synthesised *valid, decodable* mono stream whose
# SEEKTABLE seekpoints are hand-assembled verbatim from fuzzer bytes (18
# B each), bypassing `write_seektable`'s guard so unsorted / placeholder
# / out-of-range points reach `seek_points.partition_point(...)`, the
# unchecked `first_frame_offset + byte_offset` (u64 overflow + past-EOF
# candidate), and `scan.reset_to(anchor_sample)` followed by the
# CRC-verified post-seek frame walk. Each seek target is followed by a
# bounded packet drain (decode included) so the recovery path runs.
# Targets always include the fixed boundary values (i64::MIN / -1 / 0 /
# 1 / i64::MAX) so the `pts.max(0)` clamp + partition extremes are hit
# regardless of input length. Contract: pure panic-freedom.
[[bin]]
name = "seek"
path = "fuzz_targets/seek.rs"
test = false
doc = false
