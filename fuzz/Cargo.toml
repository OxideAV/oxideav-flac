[package]
name = "oxideav-flac-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
oxideav-core = "0.1"
# libloading is the only libavcodec interop: the cross-decode oracle
# `dlopen`s the system-installed shared library at startup. No
# `ffmpeg-sys` / `rusty_ffmpeg`-style build-script dep that would pull
# libavcodec source into the workspace's cargo dep tree. The harness
# skips silently (eprintln, no `#[ignore]`) when libavcodec isn't
# installed (see fuzz/src/lib.rs).
#
# Why libavcodec instead of libFLAC: libFLAC's `<FLAC/stream_decoder.h>`
# API is callback-driven (read / seek / eof / write / error / metadata
# callbacks) — wrapping that cleanly through `libloading` requires
# trampolines that hold per-call state, which is awkward and fragile.
# libavcodec exposes the simpler `avcodec_send_packet` /
# `avcodec_receive_frame` buffer-in/buffer-out API for `AV_CODEC_ID_FLAC`
# (== 86028) and is installed on every CI runner that already has
# `ffmpeg`. Workspace policy bars vendoring libavcodec / libFLAC source
# — we only inspect the public C headers (<libavcodec/avcodec.h>,
# <libavutil/frame.h>, <libavutil/samplefmt.h>) for function signatures
# + opaque pointer typedefs.
libloading = "0.8"

[dependencies.oxideav-flac]
path = ".."

[lib]
name = "oxideav_flac_fuzz"
path = "src/lib.rs"

# Prevent this fuzz package from being pulled into the umbrella
# workspace at `crates/*` glob-resolve time.
[workspace]
members = ["."]

[profile.release]
debug = 1

# ------------------------------------------------------------------
# Fuzz targets.
# ------------------------------------------------------------------

# Target 1: panic-freedom. Feed arbitrary bytes through the FLAC
# demuxer + decoder pipeline. Every public API surface MUST return a
# `Result` for malformed input — never panic, never abort.
[[bin]]
name = "panic_free_decode"
path = "fuzz_targets/panic_free_decode.rs"
test = false
doc = false

# Target 2: oxideav-flac self-roundtrip. Encode random PCM frames,
# decode, expect bit-exact recovery (FLAC is lossless).
[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false

# Target 3: libavcodec oracle. Use OUR encoder to synthesise a valid
# FLAC stream from arbitrary PCM input; decode through both
# oxideav-flac and libavcodec; assert bit-exact per-sample equality
# whenever libavcodec accepts (FLAC is lossless — no tolerance).
[[bin]]
name = "flac_oracle_decode"
path = "fuzz_targets/flac_oracle_decode.rs"
test = false
doc = false

# Target 4: panic-free decode entry, sibling-shape (ico/qoi/bmp/tta).
# A single libfuzzer entry that funnels arbitrary bytes through every
# pure-`Result` public parser (`BlockHeader::parse`,
# `StreamInfo::parse`, `parse_seektable`, `parse_cuesheet`,
# `parse_frame_header`) AND the full demux+decode pipeline. Overlaps
# with `panic_free_decode` on the pipeline path but covers the
# direct-API parsers it didn't reach. Cheap per iteration so the
# scheduler can keep it warm alongside the heavier targets.
[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false

# Target 5: METADATA_BLOCK chain walker + writer round-trip. Walks
# a `fLaC`-magic-led chain of `BlockHeader::parse` → typed parser
# (StreamInfo / SeekTable / CueSheet / Picture / PADDING-length) →
# matching writer → re-parse, asserting parser ∘ writer ∘ parser
# == parser at every step. Covers `parse_picture` + `write_picture`
# + `write_cuesheet` + `write_seektable` + `write_padding` +
# `BlockHeader::write_into`, none of which any existing target
# exercises in writer-direction. Bounded loop (≤ 16 blocks per
# iteration, ≤ 64 KiB per payload) so the fuzzer can't pin a
# worker on a pathological chain.
[[bin]]
name = "metadata_walker"
path = "fuzz_targets/metadata_walker.rs"
test = false
doc = false

# Target 6 (round 228): `make_encoder_with_options` construction +
# post-flush extradata-chain verification. Sweeps a fuzzer-chosen
# `FlacEncoderOptions { padding_bytes }` (None / Some(0) / Some(small)
# / Some(near-cap) / Some(over-cap)) alongside fuzzer-chosen channels
# (raw u8 — most values land outside the `1..=8` guard), sample rate
# (incl. pathological 0 / 1 / u32::MAX edges), and sample format. On
# every successful construction the harness walks STREAMINFO ±
# PADDING via `BlockHeader::parse`, asserting the chain invariants
# (STREAMINFO `last` flag, PADDING `last=true` + requested length +
# all-zero payload per RFC 9639 §8.6, no trailing slack). When the
# parameters round-trip cleanly, a small PCM tail is pushed through
# `send_frame` -> `flush` -> `receive_packet*` and the chain
# invariants are re-asserted on the post-flush extradata so the
# STREAMINFO repopulation can't corrupt the PADDING tail.
[[bin]]
name = "encoder_options"
path = "fuzz_targets/encoder_options.rs"
test = false
doc = false

# Target 7 (round 232): `oxideav_flac::md5` streaming-vs-oneshot
# equivalence. The encoder feeds the running MD5 a single
# deterministic schedule (one `update` per audio frame); no existing
# target stresses the chunk-schedule surface of `Md5::update` /
# `Md5::finalize`. A divergence between the streaming API and the
# oneshot `md5::compute()` helper would silently produce a
# STREAMINFO whose 128-bit MD5 signature (RFC 9639 §8.2) does not
# match the decoded PCM bytes a verifier would recompute over the
# stream — every emitted `.flac` would carry an md5sum mismatch
# under round-trip verification. The harness sweeps seven distinct
# chunk schedules per fuzz iteration (even split, xorshift-irregular,
# byte-at-a-time, zero-length interludes, `Md5::default()` parity,
# 64-byte block-aligned, prime-stride-7) against a payload tail
# capped at 8 KiB and asserts byte-for-byte equality of every
# schedule's digest against the oneshot reference. Re-asserts the
# RFC 1321 §A.5 empty-input vector on every iteration so a
# finalize-pad regression can't slip past a fuzzer that never
# produces a zero-length payload.
[[bin]]
name = "md5_streaming"
path = "fuzz_targets/md5_streaming.rs"
test = false
doc = false
